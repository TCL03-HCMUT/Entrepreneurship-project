{% extends "base.html" %} {% block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div class="col-md-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <div class="text-center mb-4">
        <div class="bg-light rounded-circle d-inline-block p-3 mb-3">
          <i
            class="bi bi-person-circle hcmut-text"
            style="font-size: 2.5rem"
          ></i>
        </div>
        <h3 class="hcmut-text fw-bold">Đăng nhập</h3>
        <p class="text-muted">Chào mừng bạn quay lại Bách Khoa Exchange!</p>
      </div>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-bold small text-muted"
            >Tên đăng nhập</label
          >
          <div class="input-group">
            <span
              class="input-group-text bg-light border-0 rounded-start-pill ps-3"
              ><i class="bi bi-person text-muted"></i
            ></span>
            <input
              type="text"
              class="form-control bg-light border-0 rounded-end-pill py-2"
              name="username"
              placeholder="Nhập username"
              required
            />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold small text-muted">Mật khẩu</label>
          <div class="input-group">
            <span
              class="input-group-text bg-light border-0 rounded-start-pill ps-3"
              ><i class="bi bi-lock text-muted"></i
            ></span>
            <input
              type="password"
              class="form-control bg-light border-0 rounded-end-pill py-2"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>
        <button
          type="submit"
          class="btn hcmut-bg text-white w-100 rounded-pill fw-bold py-2 shadow-sm mb-3"
        >
          Đăng nhập ngay
        </button>
        <p class="text-center text-muted small m-0">
          Chưa có tài khoản?
          <a href="/register" class="text-decoration-none fw-bold hcmut-text"
            >Đăng ký tại đây</a
          >
        </p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
